      <stop offset="0" stop-color="#10b981" stop-opacity="0.38"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0.34" y1="0.04" x2="0.66" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/><stop offset="0.45" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">

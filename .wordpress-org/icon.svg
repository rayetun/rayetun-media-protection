<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RayEtun Media Protection">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#042f26"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="wm2" width="22" height="22" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#ffffff" stroke-width="2.4" opacity="0.7"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#010f0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>

  <!-- back frame: clean original -->
  <g transform="rotate(-9 116 124)" filter="url(#sh)">
    <rect x="52" y="58" width="116" height="116" rx="16" fill="#3a4a61"/>
    <circle cx="83" cy="90" r="11" fill="#5b6b82"/>
    <path d="M64 152 L96 118 L114 136 L136 114 L158 152 Z" fill="#5b6b82"/>
  </g>

  <!-- front frame: watermarked + locked copy -->
  <g transform="rotate(8 144 142)" filter="url(#sh)">
    <rect x="92" y="84" width="124" height="124" rx="18" fill="#04241c"/>
    <rect x="97" y="89" width="114" height="114" rx="14" fill="url(#mark)"/>
    <circle cx="130" cy="122" r="13" fill="#065f46"/>
    <path d="M107 190 L143 152 L165 172 L187 150 L209 190 Z" fill="#065f46"/>
    <rect x="97" y="89" width="114" height="114" rx="14" fill="url(#wm2)" opacity="0.16"/>
    <g transform="translate(176,166)">
      <circle cx="19" cy="19" r="23" fill="#02120d"/>
      <rect x="8" y="18" width="22" height="16" rx="3.5" fill="#ffffff"/>
      <path d="M11.5 18 v-4.5 a7.5 7.5 0 0 1 15 0 v4.5" fill="none" stroke="#ffffff" stroke-width="3.2"/>
      <circle cx="19" cy="26.5" r="2.6" fill="#059669"/>
    </g>
  </g>
</svg>
